[project]
name = "secure-rag-gateway"
version = "0.1.0"
description = "Security gateway for RAG/LLM apps: PII pseudonymization (Presidio), prompt-injection and Llama Guard guardrails, document-level ACL, LiteLLM routing, Langfuse tracing and CI red teaming (promptfoo + garak)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Paulo Henrique Bezzani Salkys" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "presidio-analyzer>=2.2.360",
    "spacy>=3.8,<3.9",
    "pt-core-news-md @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_md-3.8.0/pt_core_news_md-3.8.0-py3-none-any.whl",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
observability = ["langfuse>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/secure_rag_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
