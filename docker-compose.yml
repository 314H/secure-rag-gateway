# Stack local completa: Ollama -> LiteLLM Proxy -> gateway.  docker compose up -d --build
# Só o gateway fica exposto ao host; Ollama e LiteLLM ficam na rede interna.
# Langfuse self-hosted: ver "Observabilidade" no README.
services:
  ollama:
    image: ollama/ollama:0.40.7
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30

  ollama-models:
    image: ollama/ollama:0.40.7
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:0.5b && ollama pull llama-guard3:1b && ollama pull embeddinggemma"]
    restart: "no"

  litellm:
    image: litellm/litellm:1.106.2
    depends_on:
      ollama-models:
        condition: service_completed_successfully
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?defina LITELLM_MASTER_KEY no .env}
      CHAT_MODEL: ${CHAT_MODEL:-ollama_chat/qwen2.5:0.5b}
      OLLAMA_API_BASE: http://ollama:11434

  gateway:
    build: .
    depends_on:
      - litellm
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LLM_BASE_URL: http://litellm:4000
      LLM_API_KEY: ${LITELLM_MASTER_KEY}
      VECTOR_PATH: /app/data/qdrant
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    volumes:
      - gateway-data:/app/data/qdrant
      - gateway-logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  ollama:
  gateway-data:
  gateway-logs:
