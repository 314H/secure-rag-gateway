# LiteLLM Proxy: ponto único de controle de modelos. O gateway só conhece os aliases abaixo.
# Para usar Azure OpenAI, Bedrock ou Vertex AI basta trocar litellm_params; o código não muda.
model_list:
  - model_name: chat-default
    litellm_params:
      model: os.environ/CHAT_MODEL            # ex.: ollama_chat/qwen2.5:0.5b
      api_base: os.environ/OLLAMA_API_BASE
    rpm: 60
    tpm: 120000

  - model_name: guard                         # Llama Guard 3 1B (classificador de segurança)
    litellm_params:
      model: ollama_chat/llama-guard3:1b
      api_base: os.environ/OLLAMA_API_BASE
    rpm: 240

  - model_name: embed
    litellm_params:
      model: ollama/embeddinggemma           # multilíngue (bom em português)
      api_base: os.environ/OLLAMA_API_BASE

litellm_settings:
  drop_params: true
  request_timeout: 180
  num_retries: 1
  # Para enviar spans das chamadas de modelo ao Langfuse, descomente e defina LANGFUSE_* no ambiente:
  # success_callback: ["langfuse"]

router_settings:
  optional_pre_call_checks:
    - enforce_model_rate_limits   # rpm/tpm acima passam a ser limite rígido, não só critério de roteamento

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
